<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 980" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .floor { fill: #fffbf4; stroke: #1b2340; stroke-width: 2; }
      .floorActive { fill: #f9cf6b; stroke: #1b2340; stroke-width: 2; }
      .label { fill: #1b2340; font-size: 25px; font-weight: 700; }
      .sub { fill: #4a4658; font-size: 16px; }
      .tiny { fill: #a08a68; font-size: 12.5px; font-style: italic; }
      .side { fill: #a6681e; font-size: 17px; font-weight: 600; letter-spacing: 2; }
      .sideSub { fill: #4a4658; font-size: 13.5px; }
      .accent { fill: #a6681e; }
      .blob { fill: none; stroke: #eaa94d; stroke-width: 2; opacity: .8; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="980" fill="#ffe8c9"/>
  <!-- líneas vivas orgánicas (motivo del manual) -->
  <path class="blob" d="M620,60 C700,20 830,60 820,130 C810,190 700,200 650,160 C615,132 585,85 620,60 Z"/>
  <path class="blob" d="M40,930 C90,890 170,900 180,950 C188,990 100,995 60,975 C35,962 25,945 40,930 Z"/>

  <text x="440" y="52" text-anchor="middle" font-size="33" font-weight="800" fill="#1b2340">QUO · SAGUNT — el mapa vertical</text>
  <text x="440" y="80" text-anchor="middle" class="tiny">dossier §05 · programa de las cuatro plantas</text>

  <!-- Terraza -->
  <rect class="floorActive" x="150" y="120" width="380" height="90" rx="8"/>
  <text x="175" y="158" class="label">LA TERRAZA VISTAS</text>
  <text x="175" y="184" class="sub">mirador al Castillo · afterwork · atardeceres de yoga</text>
  <text x="60" y="170" text-anchor="end" class="side">CUBIERTA</text>

  <!-- Planta 3 -->
  <rect class="floor" x="150" y="235" width="380" height="110" rx="6"/>
  <text x="175" y="277" class="label">PLANTA 3 · STUDIO</text>
  <text x="175" y="303" class="sub">yoga y disciplinas de calma · peluquería y barbería</text>
  <text x="175" y="327" class="tiny">profesionales residentes · reserva y calendario propio</text>
  <text x="60" y="295" text-anchor="end" class="side">CUIDADO</text>

  <!-- Planta 2 -->
  <rect class="floor" x="150" y="370" width="380" height="110" rx="6"/>
  <text x="175" y="412" class="label">PLANTA 2 · COMÚN DE ESTUDIO</text>
  <text x="175" y="438" class="sub">UNED · FP · oposiciones · tarde-noche</text>
  <text x="175" y="462" class="tiny">Corredor de Talento: mentorías, Muro, reverse recruiting</text>
  <text x="60" y="430" text-anchor="end" class="side">FORMACIÓN</text>

  <!-- Planta 1 -->
  <rect class="floorActive" x="150" y="505" width="380" height="110" rx="6"/>
  <text x="175" y="547" class="label">PLANTA 1 · COMÚN DE TRABAJO</text>
  <text x="175" y="573" class="sub">coworking corporativo · asientos de empresa · salas</text>
  <text x="175" y="597" class="tiny">el silencio es mobiliario</text>
  <text x="60" y="565" text-anchor="end" class="side">TRABAJO</text>

  <!-- Planta 0 -->
  <rect class="floorActive" x="150" y="640" width="380" height="110" rx="6"/>
  <text x="175" y="682" class="label">PLANTA 0 · ANEXO</text>
  <text x="175" y="708" class="sub">la cafetería: el salón de las cuatro plantas</text>
  <text x="175" y="732" class="tiny">escenario cívico · abierto a la calle, sin membresía</text>
  <text x="60" y="700" text-anchor="end" class="side">UMBRAL</text>

  <!-- Calle -->
  <rect x="60" y="775" width="560" height="46" fill="#f6ddb7" rx="4"/>
  <text x="340" y="804" text-anchor="middle" class="sub">la calle de Sagunto — Casco Antiguo, camino del Castillo y el Teatro Romano</text>

  <!-- ascensor: la línea del hub -->
  <line x1="340" y1="120" x2="340" y2="775" stroke="#a6681e" stroke-width="3" stroke-dasharray="7 6"/>
  <circle class="accent" cx="340" cy="165" r="7"/>
  <circle class="accent" cx="340" cy="290" r="7"/>
  <circle class="accent" cx="340" cy="425" r="7"/>
  <circle class="accent" cx="340" cy="560" r="7"/>
  <circle class="accent" cx="340" cy="695" r="7"/>

  <!-- Leyenda -->
  <text x="650" y="150" class="label" font-size="19">La regla</text>
  <text x="650" y="184" class="sideSub">Ninguna planta se</text>
  <text x="650" y="206" class="sideSub">sostiene sola: todas</text>
  <text x="650" y="228" class="sideSub">se sostienen por</text>
  <text x="650" y="250" class="sideSub">la escalera.</text>

  <text x="650" y="308" class="label" font-size="19">El producto</text>
  <text x="650" y="342" class="sideSub">no es un espacio:</text>
  <text x="650" y="364" class="sideSub">es el tránsito —</text>
  <text x="650" y="386" class="sideSub">empresa, estudio,</text>
  <text x="650" y="408" class="sideSub">calma y café en</text>
  <text x="650" y="430" class="sideSub">un mismo día.</text>

  <text x="650" y="488" class="label" font-size="19">Los ritos</text>
  <text x="650" y="522" class="sideSub">primer martes ·</text>
  <text x="650" y="544" class="sideSub">Muro · casa abierta</text>
  <text x="650" y="566" class="sideSub">· noche del común</text>

  <text x="650" y="624" class="label" font-size="19">Activación</text>
  <text x="650" y="658" class="sideSub">por capas: cada</text>
  <text x="650" y="680" class="sideSub">planta abre cuando</text>
  <text x="650" y="702" class="sideSub">su criterio se cumple</text>

  <text x="440" y="905" text-anchor="middle" class="label" fill="#a6681e">de lo público a lo íntimo · de la ciudad al tejado</text>
  <text x="440" y="935" text-anchor="middle" class="tiny">esquema de intención (no arquitectónico) · paleta y tipografía del manual de marca (Now / Montserrat — crema, ámbar, cognac, navy) · QUO status quo: mirar el estado actual de las cosas y decidir el siguiente</text>
</svg>
